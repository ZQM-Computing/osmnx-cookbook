name: Example contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install example dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile examples and tests
        run: python -m compileall -q examples tests
      - name: Run offline tests (no geocoding or Overpass requests)
        run: python -m unittest discover -s tests -v
